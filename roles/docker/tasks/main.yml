

- name: Install Docker prerequisites
  block:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required Docker packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present

  tags:
    - docker
    - dependencies

- name: Install Docker
  block:
    - name: Install Docker package
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add Vagrant user to Docker group
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

  tags:
    - docker
    - installation

