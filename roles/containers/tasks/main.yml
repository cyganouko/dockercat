

- name: Deploy Dockercat containers
  block:
    - name: Build and start application containers
      ansible.builtin.command:
        cmd: "{{ docker_compose_command }} -f {{ docker_compose_file }} up -d --build"
        chdir: "{{ app_directory }}"
      register: compose_result
      changed_when: true

    - name: Display container deployment result
      ansible.builtin.debug:
        var: compose_result.stdout_lines

  tags:
    - containers
    - deploy

