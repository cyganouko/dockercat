version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: yolo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - yolo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yolo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/yolomy
    depends_on:
      - mongodb
    networks:
      - yolo-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: yolo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - yolo-network

volumes:
  mongodb_data:

networks:
  yolo-network:
    driver: bridge
